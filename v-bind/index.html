<!DOCTYPE html>
<html>
<head>
    <title>Binding Example</title>
</head>
<body>
    <div id="message" style="color: blue;">
        This text is always blue.
    </div>
    
    <img id="image" src="https://www.gstatic.com/webp/gallery3/2.png" width="200">

    <button onclick="changeColor()">
        Change Color & Image
    </button>

    <script>
        function changeColor() {
            document.getElementById('message').style.color = 'red';
            document.getElementById('image').src=
               "https://www.gstatic.com/webp/gallery3/1.png";
        }
    </script>

</body>
</html>
